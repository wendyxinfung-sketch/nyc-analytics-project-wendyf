
name: "nyc_analytics"
version: "1.0.0"
config-version: 2

# Some default settings for dbt
profile: "default"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Set up models, which are basically SQL files, to create tables
models:
  nyc_analytics:
    +materialized: table

    # Homework 4
    assignment_work:
      staging:
        +materialized: table
        +schema: nyc_homework_staging

      marts:
        +materialized: table
        +schema: nyc_homework_warehouse_marts

        conformed:
          +materialized: table

        dob_job_filings:
          +materialized: table

        dot_311:
          +materialized: table

    # Group 1 Milestone 4
    Group_1_Milestone_4:
      staging:
        +materialized: table
        +schema: cis9440_project_g1_staging

      marts:
        +materialized: table
        +schema: cis9440_project_g1_marts

